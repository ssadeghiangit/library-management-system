<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Books - Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/books.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">📚 Library Management</div>
                <nav class="nav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="books.html" class="active">Browse Books</a>
                    <a href="my-loans.html">My Loans</a>
                    <a href="login.html" id="logoutButton">Logout</a>
                </nav>
                <div class="user-info">
                    <div class="user-avatar">S</div>
                    <span>Student Name</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <h1>Browse Books</h1>
            <p style="color: #666; margin-bottom: 2rem;">Explore our collection and find your next read.</p>
            

            
           <div id="booksLoading">Loading books...</div>

         <p id="booksError" role="alert" style="display: none;"></p>


         <div class="grid grid-3" id="booksContainer"></div>

         </div>
       </main>
     <div class="modal" id="bookDetailsModal" aria-hidden="true">
     <div class="modal__overlay" data-close-modal></div>

    <section
        class="modal__content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalBookTitle"
    >
        <button
            class="modal__close"
            type="button"
            aria-label="Close details"
            data-close-modal
        >
            &times;
        </button>

        <h2 id="modalBookTitle"></h2>

        <div class="modal__details">
            <p id="modalBookAuthor"></p>
            <p id="modalBookIsbn"></p>
            <p id="modalBookCategory"></p>
            <p id="modalBookCopies"></p>
            <p id="modalBookYear"></p>
            <p id="modalBookPublisher"></p>
        </div>

        <div class="modal__description">
            <h3>Description</h3>
            <p id="modalBookDescription"></p>
        </div>
    </section>
</div>
</body>
</html>
